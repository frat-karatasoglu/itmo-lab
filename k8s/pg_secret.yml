# Учётные данные PostgreSQL. Используются и самим postgres, и Nextcloud.
# stringData позволяет писать значения открытым текстом: Kubernetes сам
# закодирует их в base64 и сохранит в поле data.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: "nextcloud"
  POSTGRES_PASSWORD: "change_me_pg_password"
