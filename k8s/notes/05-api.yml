# Notes API: Deployment (2 init-контейнера + приложение) + Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  labels:
    app: notes-api
    app.kubernetes.io/name: notes-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: notes
    app.kubernetes.io/version: "2.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-api
  template:
    metadata:
      labels:
        app: notes-api
        app.kubernetes.io/name: notes-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: notes
        app.kubernetes.io/version: "2.1.0"
    spec:
      # Init-контейнеры выполняются по очереди, каждый до успешного завершения.
      # Основной контейнер стартует только после них.
      initContainers:
        # 1. Ждём, пока PostgreSQL начнёт принимать соединения.
        - name: wait-for-db
          image: postgres:16.6-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$POSTGRES_USER"; do
                echo "waiting for $DB_HOST:$DB_PORT..."
                sleep 2
              done
          envFrom:
            - configMapRef:
                name: notes-config
            - secretRef:
                name: notes-db-secret
        # 2. Создаём схему БД — аналог init-сервиса migrate из ЛР 2.
        - name: migrate
          image: notes-api:2.1.0 # собственный образ из Dockerfile.good
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.migrate"]
          envFrom:
            - configMapRef:
                name: notes-config
            - secretRef:
                name: notes-db-secret
          securityContext:
            runAsUser: 10001 # пользователь app из Dockerfile.good
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      containers:
        - name: api
          image: notes-api:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: notes-config
            - secretRef:
                name: notes-db-secret
          securityContext:
            runAsUser: 10001 # пользователь app из Dockerfile.good
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          # Готов ли под принимать трафик: /health проверяет и приложение, и БД.
          # Если БД недоступна, под убирается из Endpoints, но НЕ перезапускается.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Жив ли процесс: / не обращается к БД, поэтому падение БД
          # не вызывает бесполезных перезапусков API (урок ЛР 3).
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
# Доступ к API снаружи: http://<minikube ip>:30080 или `minikube service notes-api`.
apiVersion: v1
kind: Service
metadata:
  name: notes-api
  labels:
    app.kubernetes.io/name: notes-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: notes
spec:
  type: NodePort
  selector:
    app: notes-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
