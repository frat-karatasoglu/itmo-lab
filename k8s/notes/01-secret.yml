# Учётные данные PostgreSQL. Используются БД (notes-db), init-контейнерами
# и самим API (notes-api).
apiVersion: v1
kind: Secret
metadata:
  name: notes-db-secret
  labels:
    app.kubernetes.io/name: notes-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: notes
type: Opaque
stringData:
  POSTGRES_USER: "notes"
  POSTGRES_PASSWORD: "change_me_notes_password"
