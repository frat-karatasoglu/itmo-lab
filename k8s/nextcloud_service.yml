# Декларативная альтернатива команде
#   kubectl expose deployment nextcloud --type=NodePort --port=80
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  labels:
    app: nextcloud
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app: nextcloud
